:root{--ink:#041e2e;--navy:#041e2e;--teal:#00426e;--mint:#ebf7ff;--line:#d3dee5;--quiet:#475467;--paper:#f5fbff;--accent:#0098ff;--action:#00426e;--label:#fff}

h1,h2,.logo,.routecodes{font-family:"Barlow Condensed",sans-serif}h1{font-size:clamp(44px,6.7vw,84px);letter-spacing:-.023em;max-width:17ch}h2{font-size:1.55rem;font-weight:500}
.mark,.rail,.ticketfoot{color:white}.mark{box-shadow:inset 0 -4px var(--accent)}.route,.ticket{background:var(--navy)}.routecodes i{background:var(--accent)}.routecodes i:after,.rail:after{color:var(--accent)}.toolbar{border-bottom:3px solid var(--accent)}.toolbar button[aria-pressed=true],button.primary{background:var(--action);color:var(--label);border:1px solid var(--accent)}.mail,.notice,.chip{background:var(--mint);color:var(--ink)}.warn{background:#fff1cd}.road li.on:before{background:var(--action);color:var(--label)}.ticketfoot img{object-fit:contain}.drop{display:block;border:2px dashed var(--accent);padding:16px;background:var(--mint);border-radius:8px;margin:8px 0 12px;cursor:pointer}.drop small{display:block;margin:6px 0}.drop input[type=file]{max-width:100%;font-size:.8rem}.uploads{font-size:.85rem;overflow-wrap:anywhere;padding-left:20px}.explain{padding:12px 3px;max-width:66ch}.explain p{color:var(--quiet)}.doc select{max-width:17rem}
@media(max-width:670px){.toolbar{flex-wrap:wrap}.ticketfoot img{width:64px}}

.follow-header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:10px 20px}
.follow-header .kicker{margin-top:5px}.follow-header h1{margin:.17em 0}
.follow-status{display:grid;text-align:left;align-content:center;gap:4px;min-width:145px;max-width:240px;padding:13px 18px;background:var(--navy);color:white;border:0;border-left:6px solid var(--accent);border-radius:10px;box-shadow:0 3px 12px #041e2e22}
.follow-status span{font-size:.78rem;font-weight:500;color:white}.follow-status strong{font-size:clamp(1.12rem,2.2vw,1.55rem);line-height:1.08}.follow-status:hover{box-shadow:0 0 0 2px var(--accent)}
@media(max-width:520px){.follow-header{gap:8px}.follow-header h1{font-size:2.1rem}.follow-status{min-width:0;max-width:45vw;padding:11px}.follow-header .kicker{font-size:.68rem}}

.layout.tracking{display:block;max-width:1080px}.layout.tracking>aside{display:none}
.case-files{margin:24px 0;border-block:1px solid var(--line);padding:22px 0}
.files-head,.file-line,.file-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.files-head,.file-line{justify-content:space-between}.files-head{margin-bottom:14px}.files-head h2{margin:0}
.file-group{border-top:1px solid var(--line);padding:13px 0}.file-group h3{margin:4px 0 8px;font-size:1rem}
.file-group small{color:var(--quiet)}.file-line{padding:5px 0}.file-line span,.archived-file{overflow-wrap:anywhere}
.file-line span{font-size:.91rem}.file-actions{gap:6px}.file-actions button,.file-add{font-size:.84rem;padding:6px 10px}.file-add{margin-top:5px}
.file-archive{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--paper)}.archived-file{margin:8px 0}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.layout.tracking{max-width:1380px;margin-block:25px}.tracking h1{font-size:clamp(36px,4vw,54px);max-width:none}.desk-title,.desk-back,.desk-actions,.desk-tabs{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.desk-title,.desk-back{justify-content:space-between}.desk-title select{width:auto}.desk-title h1{margin-bottom:4px}
.directory{padding:0;overflow:auto}.directory table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}.directory thead{background:var(--mint)}.directory th,.directory td{padding:14px 18px;border-bottom:1px solid var(--line)}.directory thead th,.piece-name small{font-size:.8rem;color:var(--quiet)}.directory tbody tr{cursor:pointer}.directory tbody tr:hover{background:var(--paper)}
.state-tag{display:inline-block;color:var(--teal);background:var(--mint);font-weight:650;border-radius:20px;padding:5px 12px}.state-tag[data-state=ready]{background:#daf3e2;color:#17492a}.state-tag[data-state=extra]{background:#fff3cc;color:#684b00}
.desk-back{margin-bottom:16px}.desk-back button,.desk-tabs button{background:transparent}.desk-actions{margin:12px 0}.desk-actions details{position:relative}.desk-tabs{margin-top:18px;border-bottom:1px solid var(--line);gap:5px}.desk-tabs button{border:0;border-bottom:3px solid transparent;border-radius:0}.desk-tabs button[aria-pressed=true]{border-color:var(--accent);color:var(--teal)}
.desk-content{margin-top:9px;padding:14px 20px}.desk-content .case-files{margin:0;padding:0;border:0}.desk-content .files-head{margin-bottom:7px}.desk-content .files-head h2{font-size:1.25rem}
.piece-row{display:grid;align-items:center;grid-template-columns:minmax(180px,1fr) minmax(120px,1fr) auto;gap:18px;border-top:1px solid var(--line);padding:9px 0}.piece-name small{display:block;margin-top:2px}.piece-name b{font-size:.94rem}.filename{overflow-wrap:anywhere;color:var(--quiet);font-size:.88rem}.file-actions a,.archived-file a{color:var(--teal);font-size:.91rem;font-weight:650;padding:4px}.file-actions button{padding:6px 9px}.case-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.case-info dt{color:var(--quiet);font-size:.85rem}.case-info dd{margin:4px 0;font-weight:600}
@media(max-width:700px){.piece-row{grid-template-columns:1fr;gap:4px}.directory td,.directory th{padding:10px}.desk-content{padding:12px}.directory table{white-space:normal}.directory thead{display:none}.directory tr{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);padding:5px}.directory tbody th,.directory td{border:0}.directory td:last-child{text-align:right}}
.archive-dialog{width:min(420px,calc(100% - 32px));padding:24px;border:1px solid var(--line);border-radius:14px;color:var(--ink);box-shadow:0 16px 50px #10233330}
.archive-dialog::backdrop{background:#10233380}.archive-dialog p{overflow-wrap:anywhere}.archive-dialog .actions{justify-content:flex-end}
body{background:linear-gradient(#f4f1eb 35%,#faf8f4);color:#20272d}
body>header{height:auto;min-height:64px;max-width:none;padding:10px max(20px,calc((100% - 1040px)/2));background:white;box-shadow:0 1px 5px #15273718;gap:8px}
body>header .logo{font:800 italic 1.45rem "Segoe UI",sans-serif;color:#064875;letter-spacing:-1.4px}
body .mark{border-radius:7px;background:#006cab;box-shadow:none}
body:has(.home-hero) .layout>aside{display:none}
body .home-nav{margin-left:auto;display:flex;align-items:center;gap:clamp(12px,3vw,44px)}
.home-nav a,.home-nav button{font:600 .93rem "Segoe UI",sans-serif;background:none;border:0;color:#425466;text-decoration:none;padding:8px 0}
.home-nav a:hover,.home-nav button:hover{text-decoration:underline}
.home-nav .connect,.hero-cta{color:white;background:linear-gradient(105deg,#007ea8,#00549e)}
.home-nav .connect{padding:9px 21px;border-radius:22px}
.layout:has(.home-hero){display:block;margin:0 auto;padding-inline:20px;max-width:1080px}
.home-hero{text-align:center;padding:clamp(36px,5vw,66px) 0 clamp(36px,4vw,56px)}
.home-route{display:inline-flex;align-items:center;gap:11px;padding:7px 15px;border:1px solid #dededb;border-radius:30px;background:white;font-size:.85rem;font-weight:650;box-shadow:0 3px 8px #2537490e}
.home-route span{color:#0068a9}
.home-hero h1{font:750 clamp(2.55rem,4.4vw,4.1rem)/1.04 "Segoe UI",sans-serif;letter-spacing:-.053em;max-width:none;margin:22px auto 25px;color:#232628;text-wrap:balance}
.home-hero h1 em{color:#0078b1;font-style:normal;position:relative;white-space:nowrap}
.home-hero h1 em:after{content:"";position:absolute;bottom:-7px;left:3%;width:53%;height:4px;border-radius:100%;transform:rotate(-2deg);background:#0084b8}
.home-hero .lead{max-width:59ch;margin:0 auto 25px;font-size:clamp(1rem,1.55vw,1.17rem);color:#495b70}
.home-hero .demo-note{max-width:57ch;margin:0 auto 17px;color:#425669;font-size:.94rem}
.assistant-install{color:#075b88;font-weight:650;text-underline-offset:.2em}
.hero-cta{display:inline-flex;align-items:center;justify-content:center;gap:20px;padding:17px 28px;border:0;border-radius:12px;box-shadow:0 8px 19px #006ca42b;font-size:1.04rem}
.hero-cta:hover{filter:brightness(.94)}.home-hero small{display:block;margin:12px 0 4px}.hero-example{display:block;margin:12px auto 0;background:none;border:0;color:#40586b;text-decoration:underline;padding:5px;font-size:.8rem}.home-hero .uploads{list-style:none;padding:0}
.home-preview{color:#f4f8fc;background:linear-gradient(130deg,#192b45,#101c30);padding:clamp(17px,3vw,32px);border-radius:17px;border-top:4px solid #1586b7;box-shadow:0 16px 36px #0b203422}
.preview-head,.preview-line{display:flex;align-items:center;justify-content:space-between;gap:18px}.preview-head{margin-bottom:18px}.preview-head small,.preview-line small{color:#b8c9db}
.preview-head h2{font:650 1.25rem "Segoe UI",sans-serif;margin:6px 0 0;color:#fff}.preview-head img{width:64px;height:48px;object-fit:contain}
.preview-line{background:#1c304d;border:1px solid #35455f;border-radius:10px;margin-top:9px;padding:14px 18px}.preview-line b,.preview-line small{display:block}.preview-line small{margin-top:3px}
.preview-state{font-size:.82rem;color:#a3e4d1;white-space:nowrap}.preview-state:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#58d5b1;margin-right:7px}
.home-explain{display:grid;grid-template-columns:1fr 1fr;gap:clamp(22px,6vw,80px);margin:45px 0}.home-explain h3{font:700 1.25rem "Segoe UI",sans-serif}.home-explain p{color:#495b70;max-width:52ch}
@media(max-width:700px){.home-nav .connect{padding:8px 12px}.home-nav button{font-size:.82rem}.home-explain{grid-template-columns:1fr;gap:10px}.home-hero h1 em{white-space:normal}.preview-line{padding:11px}.home-hero h1{font-size:clamp(2.35rem,8vw,3.4rem)}}
@media(max-width:410px){body>header{flex-wrap:wrap}.home-nav{flex-wrap:wrap}}
:root{--paper:#f5f2ec;--ink:#202b35;--navy:#14263f;--teal:#075c88;--accent:#1488bb;--mint:#edf6fb;--line:#d8dfe4;--quiet:#4c5c70;font-family:"Segoe UI",Arial,sans-serif}
body{min-height:100vh}
h1,.tracking h1{font:750 clamp(2.25rem,4.3vw,3.65rem)/1.06 "Segoe UI",sans-serif;letter-spacing:-.048em;max-width:26ch;text-wrap:balance;color:#232628}
h2{font:670 clamp(1.15rem,2vw,1.48rem)/1.2 "Segoe UI",sans-serif;letter-spacing:-.026em}
.kicker{font:700 .8rem "Segoe UI",sans-serif;letter-spacing:.04em;color:#075f91}
.intro{color:var(--quiet);font-size:1.02rem;max-width:72ch}
button.primary,.home-nav button[aria-pressed=true]{color:white;background:linear-gradient(105deg,#007ea8,#00549e);border-color:transparent}
.home-nav button{border-radius:22px;padding:9px 16px}.home-nav button:not([aria-pressed=true]){color:#385065;background:transparent}
body:not(:has(.home-hero)) .home-nav a{display:none}
.layout:not(:has(.home-hero)){max-width:1230px}.layout:not(.tracking):not(:has(.home-hero)){grid-template-columns:minmax(210px,.58fr) minmax(0,1.6fr)}
.route,.ticket,.follow-status,.directory thead{background:linear-gradient(110deg,#19334e,#121f34)}.route,.card,.archive-dialog{box-shadow:0 5px 24px #1527390c}
.card,.archive-dialog{border-color:#dce0e0;border-radius:16px}.directory thead th{color:#eef6fb}
.road li.on{background:#e4f1f7;border-radius:8px}.road li{padding-inline:8px}
.road li.on:before{background:#086996}.desk-tabs button[aria-pressed=true]{color:#00659a}.file-actions a{color:#00669b}
.slots .notice{border:1px solid #d1e3ee;background:white}
.home-explain{gap:clamp(16px,2.3vw,28px);margin:34px 0}.home-explain>div{background:white;border:1px solid var(--line);border-radius:14px;padding:clamp(20px,3vw,29px)}.home-explain h3{color:#075b88;margin-bottom:10px}.home-explain p{margin-bottom:0}
.desk-benefit{margin:8px 0 14px;color:var(--quiet);line-height:1.45}.desk-benefit summary{display:inline-block;color:var(--teal);font-size:.91rem}.desk-benefit summary:before{content:'＋ ';}.desk-benefit[open] summary:before{content:'− '}.desk-benefit p{max-width:74ch;margin:5px 0}
@media(max-width:700px){.home-nav button{padding:7px 10px}.follow-header h1{font-size:clamp(1.9rem,6.8vw,2.5rem)}}
.home-section-title{font-size:clamp(1.65rem,3vw,2.15rem);margin:0}.home-explain>.home-section-title{grid-column:1/-1}
.home-explain h3,.home-workflow h3{margin-top:0}.home-workflow{scroll-margin-top:20px;border-top:1px solid var(--line);padding:28px 0 36px}
.home-workflow ol{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 30px;margin:22px 0 0;padding-left:1.65em}
.home-workflow li{padding:0 10px 0 3px}.home-workflow li::marker{color:#075b88;font-weight:700}
.home-workflow h3{margin-bottom:5px;font-size:1.04rem}.home-workflow p{margin:0;color:var(--quiet)}
@media(max-width:830px){.home-workflow ol{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.home-workflow ol{grid-template-columns:1fr}.home-nav a[href="#fonctionnement"]{display:inline-block}body:has(.home-hero)>header{flex-wrap:wrap}body:has(.home-hero) .home-nav{flex-wrap:wrap;gap:4px 9px}}
.brand-home{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:inherit;border-radius:7px}.brand-home:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.home-nav [hidden]{display:none}.home-nav .broker-login:not([aria-pressed=true]){background:linear-gradient(105deg,#007ea8,#00549e);color:white}
.layout.tracking:has(.home-hero){max-width:1080px;margin-block:0}.partner-access{max-width:520px;margin:clamp(32px,8vh,80px) auto}.partner-access h1{font-size:clamp(2rem,4vw,2.8rem);margin:12px 0}.partner-access p{overflow-wrap:anywhere}.partner-access p:last-child{margin-bottom:0}.preview-state.attention{color:#ffdb9c}.preview-state.attention:before{background:#ffc86b}

async function restoreDesk(){
 try{
  database=await new Promise((resolve,reject)=>{
   const req=indexedDB.open('customsflow-maquette-dossiers',1);
   req.onupgradeneeded=()=>req.result.createObjectStore('desk');
   req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
  });
  const store=database.transaction('desk').objectStore('desk');
  const saved=await new Promise((resolve,reject)=>{const r=store.get('snapshot');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
  if(saved){for(const item of saved.items)records.set(item.id,item);account=saved.account;daily=saved.daily;
   for(const [day,counts] of saved.counts)if(occupancy.has(day))occupancy.set(day,counts);}
 }catch{database=null}
 render();
}

function assistantContext(){

 context.view='case';
 context.dossier={id:data.id,buyer:data.buyer,vehicle:data.vehicle,status:data.status,documents:[]};
 if(!['work','ready','extra'].includes(data.status))return context;
 const groups=fileGroups(),files=dossierFiles();
 for(const file of files){
  if(file.archived)continue;
  const [owner,title]=groups[file.group];
  let fields=file.fields||[];
  // Older cases stored the vehicle and invoice values but not every reviewed field.
  if(!file.fields&&file===files.find(entry=>entry.group===file.group)&&file.group<2){
   fields=extractedFields(file.group).filter(([key])=>data[key]!=null)
    .map(([key,label])=>({label,value:String(data[key])}));
  }
  context.dossier.documents.push({title:title+' · '+owner+' · '+file.name,fields});
 }
 return context;
}

const crcTable=Uint32Array.from({length:256},(_,byte)=>{
 let crc=byte;
 for(let i=0;i<8;i++)crc=(crc>>>1)^((crc&1)?0xedb88320:0);
 return crc>>>0;
});
async function documentZip(files){
 const contents=[],directory=[],encoder=new TextEncoder();
 let offset=0,directorySize=0;
 for(const [index,file] of files.entries()){
  const blob=file.blob||samplePdf;
  const bytes=new Uint8Array(await blob.arrayBuffer());
  let crc=0xffffffff;
  for(const byte of bytes)crc=crcTable[(crc^byte)&255]^(crc>>>8);
  crc=(crc^0xffffffff)>>>0;
  const safeName=file.name.replace(/[\\/:*?"<>|\x00-\x1f]/g,'_');
  const name=encoder.encode(String(index+1).padStart(2,'0')+' - '+safeName);
  // ZIP sans compression : en-tête local, puis entrée correspondante dans le répertoire central.
  const local=new DataView(new ArrayBuffer(30)),entry=new DataView(new ArrayBuffer(46));
  local.setUint32(0,0x04034b50,true);entry.setUint32(0,0x02014b50,true);
  entry.setUint16(4,20,true);
  for(const [header,start] of [[local,4],[entry,6]]){
   header.setUint16(start,20,true);
   header.setUint16(start+2,0x0800,true); // Nom UTF-8
   header.setUint16(start+8,33,true); // 1er janvier 1980, date DOS minimale
   header.setUint32(start+10,crc,true);
   header.setUint32(start+14,blob.size,true);
   header.setUint32(start+18,blob.size,true);
   header.setUint16(start+22,name.length,true);
  }
  entry.setUint32(42,offset,true);
  contents.push(local,name,blob);directory.push(entry,name);
  offset+=local.byteLength+name.length+blob.size;directorySize+=entry.byteLength+name.length;
  if(offset+directorySize>0xffffffff||files.length>65535)throw new RangeError('Taille ZIP dépassée');
 }
 const end=new DataView(new ArrayBuffer(22));
 end.setUint32(0,0x06054b50,true);
 end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);
 end.setUint32(12,directorySize,true);end.setUint32(16,offset,true);
 return new Blob([...contents,...directory,end],{type:'application/zip'});
}
async function downloadAll(button){
 const files=dossierFiles().filter(file=>!file.archived),caseId=data.id;
 if(!files.length||button.disabled)return;
 button.disabled=true;button.textContent='Préparation du ZIP…';
 try{
  const url=URL.createObjectURL(await documentZip(files));
  const link=document.createElement('a');
  link.href=url;link.download=caseId+'-documents.zip';link.click();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
 }catch{if(button.isConnected)err('Impossible de créer le ZIP. Vous pouvez réessayer ou télécharger les pièces individuellement.')}
 finally{button.disabled=false;button.textContent='Tout télécharger'}
}

function bindFiles(view){
 const panel=view.querySelector('.case-files');
 if(!panel)return;
 const input=panel.querySelector('input');
 panel.onclick=event=>{
  const button=event.target.closest('button[data-action]');
  if(!button)return;
  const id=Number(button.dataset.id),action=button.dataset.action,records=dossierFiles();
  if(action==='archive'){
   const file=records[id],owner=data;
   if(file.archived||panel.querySelector('dialog'))return;
   const dialog=panel.ownerDocument.createElement('dialog');
   dialog.className='archive-dialog';
   dialog.setAttribute('aria-labelledby','archive-title');
   dialog.setAttribute('aria-describedby','archive-description');
   dialog.innerHTML='<form method="dialog"><h2 id="archive-title">Archiver ce document ?</h2>'+
    '<p id="archive-description">« '+esc(file.name)+' » restera consultable dans les documents archivés.</p>'+
    '<div class="actions"><button value="cancel" autofocus>Annuler</button><button class="primary" value="archive">Archiver</button></div></form>';
   panel.append(dialog);
   dialog.addEventListener('close',()=>{
    const confirmed=dialog.returnValue==='archive'&&dialog.isConnected;
    dialog.remove();
    if(!confirmed||owner!==data||file.archived)return;
    file.archived=true;
    recordEvent('Document archivé · '+file.name);saveDesk();
    render();
    view.querySelector('.file-archive summary')?.focus();
   },{once:true});
   dialog.showModal();
   return;
  }
  input.onchange=()=>{
   const files=Array.from(input.files);
   if(!files.length)return;
   for(const file of files){
    records.push({group:id,name:file.name,blob:file,archived:false});
    recordEvent('Document ajouté · '+file.name);
   }
   saveDesk();render();
  };
  input.click();
 };
}

 $('view').innerHTML='<section class="partner-access card"><div class="kicker">Espace transitaire · BLR Bellereaux</div><h1>'+(signup?'Inscrivez-vous':'Connectez-vous')+'</h1><p>Essayez avec l’adresse fictive proposée. Le lien de '+(signup?'confirmation':'connexion')+' s’affichera ici.</p>'+
  '<form onsubmit="submitPartnerAccess(event)">'+(signup?field('Votre nom','broker-contact',brokerContact,'text','autocomplete="name"'):'')+
  field('Adresse e-mail professionnelle','broker-email',brokerEmail,'email','autocomplete="email"')+
  '<button class="primary" type="submit">'+(signup?'Recevoir mon lien d’inscription':'Recevoir mon lien de connexion')+'</button></form>'+
  '<div class="actions">'+btn(signup?'Déjà inscrit ? Se connecter':'Première visite ? S’inscrire',signup?"partnerPage('connexion')":"partnerPage('inscription')")+'</div></section>';
}

function setRole(r){dashboard(r)}
$('clientTab').onclick=()=>setRole('client');$('belroTab').onclick=()=>role==='belro'?dashboard('belro'):partnerPage('presentation');
function err(msg){$('err').textContent=msg;}


function render(){
 const publicPartner=role==='belro'&&partnerPages.includes(screen);
 for(const id of ['belroTab','clientTab'])$(id).hidden=publicPartner;
 for(const id of ['broker-signup','broker-login'])$(id).hidden=!publicPartner;
 const tracking=role==='client'&&step===5&&data.paid;
 document.querySelector('.layout').classList.toggle('tracking',tracking||clientList||role==='belro');
 $('road').hidden=tracking;

 $('clientTab').setAttribute('aria-pressed',role==='client');$('belroTab').setAttribute('aria-pressed',role==='belro');
 const stages=role==='client'?names:['Avis par e-mail','Revue du dossier','Attribution du créneau','Confirmation'];
 const index=role==='client'?step:screen==='inbox'?0:screen==='calendar'?2:data.booking?3:1;
 $('road').innerHTML=stages.map((s,i)=>'<li class="'+(i===index?'on':'')+'" '+(i===index?'aria-current="step"':'')+'>'+s+'</li>').join('');
 if(publicPartner)partnerPublicView();
 else if((role==='client'&&clientList)||(role==='belro'&&screen==='inbox'))directory();
 else if(role==='belro'&&screen==='calendar')calendar();
 else if(role==='belro'||(tracking&&linked))detailsDesk();
 else client();
 syncAssistantContext();
 updateLiveClient();
}
function client(){
 const k='Espace client · '+(step+1)+' / 6';
 if(step===0){
  const filesAdded=imports.length>0;
  const resume=filesAdded||draftStep>0;
  const upload='<input type="file" id="upload" multiple accept="application/pdf,image/*" hidden onchange="importFiles(this.files)">';
  const preview=[['Certificat d’immatriculation suisse','Véhicule'],['Facture ou contrat de vente','Achat'],['Pièce d’identité','Acheteur']];
  $('view').innerHTML=`<section class="home-hero">
   <div class="home-route">Suisse <span aria-hidden="true">→</span> France</div>
   <h1>Votre véhicule vient de Suisse.<br>Préparez <em>son importation.</em></h1>
   <p class="lead">Déposez vos pièces en ligne. BLR Bellereaux examine votre dossier avant votre rendez-vous au bureau.</p>
   <p class="demo-note"><strong>Démonstration.</strong> Utilisez uniquement des pièces fictives. Vos fichiers restent dans ce navigateur. Le paiement et les e-mails sont simulés.</p>
   ${upload}
   ${filesAdded?'<ul class="uploads">'+imports.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul>':''}
   <button class="hero-cta" onclick="${resume?'go(draftStep||1)':"document.getElementById('upload').click()"}">${resume?'Continuer mon dossier':'Déposer mes documents'} <span aria-hidden="true">→</span></button>
   ${filesAdded?'<button class="hero-example" onclick="document.getElementById(\'upload\').click()">Ajouter des pièces</button>':'<button class="hero-example" onclick="useExamples()">Essayer avec des pièces fictives</button>'}
  </section>
  <section class="home-preview" aria-label="Exemple de dossier">
   <div class="preview-head"><div><small>Aperçu du suivi client</small><h2>Les pièces de votre dossier</h2></div><img alt="BLR Bellereaux" src="${$('brandLogo').src}"></div>
   ${preview.map(([title,who])=>'<div class="preview-line"><div><b>'+title+'</b><small>'+who+'</small></div><span class="preview-state">Reçue</span></div>').join('')}
  </section>
  <section class="home-explain" aria-labelledby="benefits-title">
   <h2 id="benefits-title" class="home-section-title">Les avantages de CustomsFlow</h2>
   <div><h3>Évitez un aller-retour pour une facture illisible</h3><p>BLR examine vos pièces avant le rendez-vous. Si une copie manque ou se lit mal, ajoutez-la depuis chez vous.</p></div>
   <div><h3>Moins de saisie, même pour le numéro de série</h3><p>CustomsFlow reprend les informations de vos documents. Vous les relisez et les corrigez avant l’envoi.</p></div>
   <div><h3>« Où en est mon dossier ? »</h3><p>Ouvrez votre lien de suivi pour voir si BLR examine vos pièces, attend un complément ou a terminé.</p></div>
   <div><h3>Planifiez votre trajet</h3><p>Une fois le dossier prêt, vous recevez par e-mail la date et l’heure de votre passage au bureau.</p></div>
  </section>
  <section class="home-workflow" id="fonctionnement" aria-labelledby="workflow-title">
   <h2 id="workflow-title" class="home-section-title">Comment ça marche ?</h2>
   <ol>
    <li><h3>Déposez vos documents</h3><p>Ajoutez la carte grise suisse, la facture ou le contrat de vente et vos justificatifs.</p></li>
    <li><h3>Précisez pour qui vous achetez</h3><p>Indiquez si l’acheteur est un particulier ou une entreprise. Si vous agissez par procuration, joignez aussi le mandat et vos justificatifs.</p></li>
    <li><h3>Vérifiez chaque pièce</h3><p>Relisez les informations extraites, corrigez-les si besoin et validez chaque document.</p></li>
    <li><h3>Envoyez votre dossier</h3><p>Renseignez votre e-mail et simulez le paiement pour retrouver le dossier dans l’espace BLR Bellereaux.</p></li>
    <li><h3>Suivez le traitement</h3><p>Ouvrez le lien reçu par e-mail. Si BLR demande un complément, ajoutez la pièce dans votre espace client.</p></li>
    <li><h3>Recevez votre rendez-vous</h3><p>Un e-mail vous avertit dès que le dossier est prêt. Le suivant précise la date et l’heure de votre passage au bureau. En cas de procuration, le mandataire reçoit le rendez-vous.</p></li>
   </ol>
  </section>`;
  return;
 }
 if(step===1){shell(k,'Pour qui est cet achat ?','Vous achetez pour vous ou pour quelqu’un d’autre ? Votre réponse détermine les pièces à joindre et la personne qui recevra le rendez-vous.',
 '<div class="field"><span>Opération</span><p>Achat en Suisse pour importation en France</p></div><div class="two"><label class="field"><span>Acheteur</span><select id="pro"><option>Particulier</option><option '+(data.pro?'selected':'')+'>Professionnel</option></select></label><label class="field"><span>Démarche</span><select id="proxy"><option>En mon nom / pour mon entreprise</option><option '+(data.proxy?'selected':'')+'>Par procuration</option></select></label></div>'+field('Nom de l’acheteur ou raison sociale','buyer',data.buyer)+btn('Continuer vers les pièces','profile()',true)+btn('Revoir le dépôt','go(0)'));return;}
 if(step===2){shell(k,'Réunir les justificatifs','Associez chaque fichier à son titulaire pour que BLR retrouve les bonnes pièces dès l’ouverture du dossier. Pour essayer la maquette, vous pouvez joindre les exemples.',(data.pro?'<p class="notice">Parcours professionnel proposé. Les pièces propres à l’entreprise restent à valider.</p>':'')+documents(true)+'<div class="actions">'+btn('Joindre tous les exemples','attachAll()')+btn('Vérifier les informations','review()',true)+btn('Retour au profil','go(1)')+'</div><p class="hint">Conservation des pièces personnelles : six mois maximum après le rendez-vous ou la clôture du dossier refusé ou abandonné.</p>');return;}
 if(step===3){showDocumentReview(k);return;}
 if(step===4){shell(k,'Paiement de démonstration','Le paiement et l’envoi à BLR Bellereaux sont simulés. Vos pièces restent dans ce navigateur.', field(data.proxy?'E-mail du mandataire pour le suivi':'Mon e-mail pour le suivi','email',data.email||(data.proxy?'mandataire@example.test':'camille@example.test'),'email','autocomplete="off"')+'<p class="hint">Vous pouvez garder l’adresse fictive proposée. Votre e-mail de suivi s’affichera ici.</p>'+check('terms','J’ai vérifié les informations de mon dossier.')+'<div class="actions">'+btn('Simuler le paiement','pay(true)',true)+btn('Tester un paiement refusé','pay(false)')+btn('Revoir les données','review()')+'</div>');return;}
 if(data.paid&&!linked){shell(k,'Dossier envoyé à '+partnerName,'Simulation du paiement réussie · '+esc(data.id),
 '<h2>Que se passe-t-il maintenant ?</h2><ol><li><strong>Votre transitaire examine vos pièces.</strong> Si un document manque ou doit être corrigé, il vous indique lequel fournir pour poursuivre le traitement.</li><li><strong>Vous recevez un e-mail dès que votre dossier est prêt.</strong> Votre transitaire a terminé sa vérification. CustomsFlow recherche alors le premier créneau disponible.</li><li><strong>Vous recevez votre rendez-vous par e-mail.</strong> La confirmation vous indique la date et l’heure auxquelles vous présenter au bureau.</li></ol><div class="mail"><small>E-mail de suivi simulé · '+esc(data.email)+'</small><h2>Retrouvez votre dossier</h2>'+btn('Ouvrir mon lien de suivi','openTracking()',true)+'</div><details><summary>Avis e-mail du transitaire (simulation)</summary>'+btn('Ouvrir le dossier reçu','openPartnerEmail()')+'</details><details><summary>Historique</summary>'+historyView()+'</details>');return;}
 }
function openPartnerEmail(){role='belro';chooseCase(data.id)}
function openTracking(){account=data.email.toLowerCase();saveDesk();dashboard('client')}
function profile(){if(!$('buyer').reportValidity())return;
 const proxy=!!$('proxy').selectedIndex,pro=!!$('pro').selectedIndex;if(proxy!==data.proxy||pro!==data.pro||$('buyer').value!==data.buyer)reviewedValues.clear();if(pro!==data.pro){delete data.docs[2];delete data.docs[3]}if(!proxy){for(const i of [4,5,6])delete data.docs[i]}Object.assign(data,{buyer:$('buyer').value,proxy,pro});go(2)}
function attach(i){reviewedValues.delete(i);data.docs[i]=true;render()}
function attachAll(){reviewedValues.clear();docList().forEach((_,i)=>data.docs[i]=true);render()}
let currentDocument=0;
const reviewedValues=new Map();
function review(){
 const missing=docList().findIndex((_,i)=>!data.docs[i]);
 if(missing>=0)return err('Pièce à joindre : '+docList()[missing].join(' · '));
 currentDocument=0;
 go(3);
}
function extractedFields(index){
 const contact=data.pro?'Camille Martin':data.buyer;
 const agent=data.agent||'Alex Robin';
 return [
  [['vehicle','Marque et modèle',data.vehicle],['vin','Numéro de série VIN',data.vin,'text','pattern="[A-HJ-NPR-Z0-9]{17}" maxlength="17"']],
  [['buyer',data.pro?'Entreprise acheteuse':'Acheteur',data.buyer],['seller','Vendeur',data.seller],['amount','Prix de vente en CHF',data.amount,'number','min="0.01" step="0.01"']],
  [['holder','Nom sur la pièce',contact]],
  [['holder','Titulaire du justificatif',contact],['address','Adresse de domicile','12 rue Exemple, 74000 Annecy']],
  [['principal','Personne ou entreprise donnant procuration',data.buyer],['delegate','Personne mandatée',agent]],
  [['agent','Nom sur la pièce',agent]],
  [['holder','Titulaire du justificatif',agent],['address','Adresse de domicile','8 rue Exemple, 74100 Annemasse']]
 ][index];
}
function showDocumentReview(k){
 const list=docList();
 const [holder,title]=list[currentDocument];
 const source=typeof data.docs[currentDocument]==='string'?data.docs[currentDocument]:'Pièce fictive';
 const values=reviewedValues.get(currentDocument)||{};
 const fields=extractedFields(currentDocument).map(([id,label,initial,type,attrs])=>
  field(label,id,values[id]??initial,type,attrs)).join('');
 const last=currentDocument===list.length-1;
 shell(k,title,'Comparez les informations extraites avec votre document. Vous pouvez corriger une erreur ici avant de passer à la pièce suivante.',
  '<p class="chip" aria-live="polite">Document '+(currentDocument+1)+' sur '+list.length+'</p>'+
  '<p><b>'+esc(holder)+'</b> · '+esc(source)+'<br><small>Extraction simulée pour la maquette</small></p>'+fields+
  '<div class="actions">'+btn(last?'Valider et passer au paiement':'Valider et voir le document suivant','validateDocument()',true)+
  (currentDocument?btn('Document précédent','previousDocument()'):btn('Revoir les pièces','go(2)'))+'</div>');
}
function previousDocument(){currentDocument--;render();$('view').focus()}
function validateDocument(){
 const values={};
 for(const [id] of extractedFields(currentDocument)){
  const input=$(id);
  if(!input.reportValidity())return;
  values[id]=input.value.trim();
  if(!values[id]){input.focus();return err('Renseignez la valeur avant de valider cette pièce.')}
 }
 reviewedValues.set(currentDocument,values);
 for(const key of ['buyer','agent','seller','amount','vehicle','vin'])if(key in values)data[key]=values[key];
 if(currentDocument===docList().length-1)go(4);
 else{currentDocument++;render()}
 $('view').focus();
}
function pay(ok){if(!$('email').reportValidity())return;data.email=$('email').value.trim();if(!$('terms').checked)return err('Confirmez la vérification de votre dossier pour poursuivre.');if(!ok)return err('Paiement refusé. Le dossier reste chez CustomsFlow. Vous pouvez réessayer.');data.receivedAt=new Date();data.paid=true;data.office=partner;
 data.id='CF-'+String(Math.max(25,...[...records.keys()].map(key=>Number(key.slice(3))))+1).padStart(3,'0');
 for(const file of dossierFiles()){
  const values=reviewedValues.get(file.group)||{};
  file.fields=extractedFields(file.group).filter(([key])=>Object.hasOwn(values,key)).map(([key,label])=>({label,value:values[key]}));
 }
 records.set(data.id,data);account=data.email.toLowerCase();recordEvent(statuses.new);
 draft=structuredClone(blankCase);draft.email=data.email;draft.buyer=data.buyer;draftStep=0;
 imports.length=0;uploads.clear();reviewedValues.clear();currentDocument=0;saveDesk();go(5)}
function supply(){if(data.status!=='extra')return;data.supplement=data.message;recordEvent('Complément transmis');statusTo('work')}
function confirmation(){return '<div class="mail"><small>E-mail de rendez-vous simulé · '+(data.proxy?'Mandataire uniquement':'Contact du dossier')+'</small><h2>'+fmt(data.booking.day)+' · '+slots[data.booking.slot]+'</h2><p>Destinataire : '+esc(data.email)+`<br>Accueil ${partnerName} · adresse du pilote à confirmer.</p></div>`;}
function changeScreen(s){screen=s;render()}
function recordEvent(label){
 data.events.push({label,time:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Paris'})});
}
function historyView(){
 return '<section id="case-history" tabindex="-1"><h2>Historique du dossier</h2><ol>'+data.events.map(event=>'<li>'+esc(event.label)+' · '+esc(event.time)+'</li>').join('')+'</ol></section>';
}
function readyMail(){
 return '<div class="mail"><small>E-mail de suivi simulé · '+esc(data.email)+'</small><h2>Votre dossier est prêt</h2><p>'+esc(partnerName)+' a terminé la vérification de vos pièces.</p></div>';
}
function openLiveClient(){
 if(!liveClient||liveClient.closed){
  liveClient=window.open('about:blank','_blank');
  if(!liveClient)return err('Autorisez l’ouverture de la fenêtre de suivi dans votre navigateur.');
  const page=liveClient.document;
  page.documentElement.lang='fr';
  page.title='Suivi client · CustomsFlow';
  page.head.append(document.querySelector('style').cloneNode(true));
  page.body.innerHTML='<main id="live" style="max-width:680px;padding:24px;margin:auto" aria-live="polite"></main>';
 }
 updateLiveClient();
 liveClient.focus();
}
function updateLiveClient(){
 if(!liveClient||liveClient.closed)return;
 let page;
 try{page=liveClient.document}catch{liveClient=null;return}

 const view=page.getElementById('live');
 if(!view)return;
 view.innerHTML=trackingHeader('Suivi client · '+esc(data.id),'Mon dossier')+'<p>'+esc(partnerName)+' · '+esc(data.vehicle)+'</p>'+
 (['extra','refused'].includes(data.status)?'<p class="notice">'+esc(data.message)+'</p>':'')+
 (data.status==='ready'?readyMail():'')+(data.booking?confirmation():'')+filePanel()+historyView();
 bindStatusButton(view);
 bindFiles(view);
}
function statusTo(s){
 if(data.status===s)return;
 data.status=s;recordEvent(statuses[s]);saveDesk();render();
}
function decision(s){if(!$('reason').value.trim())return err('Précisez le motif à communiquer au client.');data.message=$('reason').value.trim();statusTo(s)}
function assignEarliest(now){
 if(data.status!=='ready'||data.booking)return;
 const start=parisTime(new Date(Math.max(data.receivedAt.getTime(),now.getTime())));
 for(const day of [...occupancy.keys()].sort()){
  const used=occupancy.get(day);
  if(day<start.day||used.reduce((a,b)=>a+b,0)>=daily)continue;
  const slot=used.findIndex((count,index)=>count<slotCapacity&&(day>start.day||slotStartMinutes[index]>=start.minutes));
  if(slot===-1)continue;
  used[slot]+=1;
  data.booking={day,slot};
  recordEvent(statuses.booked);
  agendaDay=day;
  return;
 }
}
function markReady(){
 if(data.status!=='work')return;
 data.status='ready';
 recordEvent(statuses.ready);
 assignEarliest(new Date());
 saveDesk();render();
}
function calendar(){
 const counts=occupancy.get(agendaDay);
 const options=[...occupancy.keys()].sort().map(day=>'<option value="'+day+'" '+(day===agendaDay?'selected':'')+'>'+fmt(day)+'</option>').join('');
 shell(`${partnerName} · Agenda`,'Planning des rendez-vous','Consultez les places réservées par tranche de deux heures. Dès qu’un dossier est prêt, le premier créneau disponible lui est attribué dans la limite de votre capacité.',
 '<label class="field"><span>Journée ouverte · calendrier de démonstration</span><select id="date" onchange="agendaDay=this.value;render()">'+options+'</select></label>'+
 '<div class="row"><h2>'+fmt(agendaDay)+'</h2><span class="chip">'+counts.reduce((a,b)=>a+b,0)+' / '+daily+' véhicules</span></div>'+
 '<div class="slots">'+slots.map((label,index)=>'<div class="notice"><b>'+label+'</b><small>'+counts[index]+' / '+slotCapacity+' réservés</small></div>').join('')+'</div><p class="hint">Pause déjeuner de 12 h à 13 h 30.</p>'+
 '<details><summary>Régler le plafond quotidien</summary>'+field('Véhicules par jour','limit',daily,'number','min="1" max="15"')+btn('Appliquer le plafond','saveDaily()')+'</details><div class="actions">'+btn('Retour au dossier','changeScreen(\'case\')')+'</div>');
}
function saveDaily(){
 if(!$('limit').reportValidity())return;
 daily=Number($('limit').value);
 assignEarliest(new Date());
 saveDesk();render();
}
function resetDemo(){if(confirm('Recommencer la visite avec un dossier vierge ?')){liveClient?.close();if(database){const tx=database.transaction('desk','readwrite');tx.objectStore('desk').clear();tx.oncomplete=()=>location.reload()}else location.reload()}}
restoreDesk();
</script></body></html>
